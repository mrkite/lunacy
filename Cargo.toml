[package]
name = "lunacy"
version = "0.3.0"
description = "Viewer for retro filetypes"
repository = "https://github.com/mrkite/lunacy"
readme = "README.md"
license-file = "LICENSE"
keywords = ["lunacy", "hex", "disassembly", "retro"]
categories = ["development-tools"]
edition = "2024"

[dependencies]
chrono = "0.4.43"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
lazy_static = "1.5.0"
num-format = "0.4.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
